# Assured Agent Execution — the whole product, locally, in production mode.
#
#   python run.py up          verify the pin, build, migrate, start
#   python run.py scenarios   run the four decisions
#   python run.py down        tear down, including volumes
#
# Nothing to fill in first: `run.py up` generates this installation's own keys,
# passwords and tokens into .env and picks free ports.
#
# REMORA_ENV=production makes the fail-closed prerequisites binding — durable
# execution state, a durable envelope store, and a token table with real role
# separation. Remove any one and the control plane refuses to start.
#
# REMORA_ENABLED_SURFACES=execution unmounts the oracle-backed research API, so
# this runs with no model key and no network egress.
#
# See docs/architecture.md for why each boundary is where it is.

name: aae

services:

  # ── Control-plane state ─────────────────────────────────────────────
  # Audit chain, review queue, grant ledger, outbox, envelopes. Core-owned
  # tables. Not published: only the control plane needs it.
  control-plane-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: remora
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run "python run.py up" first}
      POSTGRES_DB: remora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remora -d remora"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose: ["5432"]
    networks: [data]
    volumes:
      - control-plane-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres drops from root to the postgres user at startup.
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 128

  # ── The system of record ────────────────────────────────────────────
  # A separate database, so the effect reader can hold a credential that
  # cannot write it. Published, because that reader runs outside the
  # control plane — a different process from the one that acted.
  workorder-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: wo_admin
      POSTGRES_PASSWORD: ${WORKORDER_DB_PASSWORD:?run "python run.py up" first}
      POSTGRES_DB: workorders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wo_admin -d workorders"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data, edge]
    ports:
      - "127.0.0.1:${AAE_WORKORDER_DB_PORT:-55432}:5432"
    volumes:
      - workorder-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres drops from root to the postgres user at startup.
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 128

  # ── Migrations ──────────────────────────────────────────────────────
  # One-shot, under the admin role, before anything else connects. The
  # worker and reader roles it creates hold no DDL rights: a running
  # product should not be able to change its own schema.
  workorder-migrate:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      workorder-db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${WORKORDER_DB_PASSWORD}
      # The two role passwords the grants file needs. Passed as psql variables
      # rather than baked into the SQL, so nothing secret is ever committed.
      AAE_WORKER_PASSWORD: ${AAE_WORKER_PASSWORD:?run "python run.py up" first}
      AAE_READER_PASSWORD: ${AAE_READER_PASSWORD:?run "python run.py up" first}
    networks: [data]
    volumes:
      - ./db/workorders:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        PSQL="psql -h workorder-db -U wo_admin -d workorders -v ON_ERROR_STOP=1"
        echo "applying 001_initial.sql"
        $$PSQL -q -f /migrations/001_initial.sql
        echo "applying 002_roles.sql"
        $$PSQL -q \
          -v worker_password="$$AAE_WORKER_PASSWORD" \
          -v reader_password="$$AAE_READER_PASSWORD" \
          -f /migrations/002_roles.sql
        $$PSQL -tAc \
          "SELECT 'system of record at schema version ' || max(version) FROM schema_version"
    restart: "no"

  # Grants the console a SELECT-only credential on the governance database.
  # Runs before the control plane, which is why 001 uses ALTER DEFAULT
  # PRIVILEGES: the core creates its tables lazily, so on a fresh volume there
  # is nothing to grant on yet.
  chain-reader-grant:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      control-plane-db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      AAE_CHAIN_READER_PASSWORD: ${AAE_CHAIN_READER_PASSWORD:?run "python run.py up" first}
    networks: [data]
    volumes:
      - ./db/controlplane:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql -h control-plane-db -U remora -d remora -v ON_ERROR_STOP=1 -q           -v chain_reader_password="$$AAE_CHAIN_READER_PASSWORD"           -f /migrations/001_chain_reader.sql
    restart: "no"

  # ── The governed control plane ──────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    depends_on:
      control-plane-db: {condition: service_healthy}
      workorder-migrate: {condition: service_completed_successfully}
      chain-reader-grant: {condition: service_completed_successfully}
    networks: [data, edge]
    ports:
      - "127.0.0.1:${AAE_API_PORT:-8088}:8000"
    environment:
      REMORA_ENV: production
      REMORA_ENABLED_SURFACES: execution

      # --- Fail-closed prerequisites -------------------------------------
      # Durable execution state: tenant audit chain, review queue, and the
      # one-time-grant ledger. Without it a consumed grant is replayable by
      # another worker or after a restart.
      REMORA_PG_DSN: postgresql://remora:${CONTROL_PLANE_DB_PASSWORD}@control-plane-db:5432/remora
      REMORA_CONTROL_PLANE_DSN: postgresql://remora:${CONTROL_PLANE_DB_PASSWORD}@control-plane-db:5432/remora

      # Token table — the only mode with real role separation. None of the
      # approver roles is `admin`: admin holds every capability including
      # execute, so an admin approver can approve its own proposal and then
      # execute it. Three approver roles because REMORA decides per decision
      # which one may release it.
      REMORA_API_TOKENS: >-
        {"${AAE_TOKEN_AGENT}":{"tenant":"aae-work-orders","role":"operator"},
         "${AAE_TOKEN_REVIEWER}":{"tenant":"aae-work-orders","role":"reviewer"},
         "${AAE_TOKEN_EXPERT}":{"tenant":"aae-work-orders","role":"domain_expert"},
         "${AAE_TOKEN_SENIOR}":{"tenant":"aae-work-orders","role":"senior_authority"},
         "${AAE_TOKEN_VIEWER}":{"tenant":"aae-work-orders","role":"viewer"}}
      REMORA_API_BEARER_TOKEN: ${AAE_TOKEN_AGENT}

      # --- Signing -------------------------------------------------------
      # Generated per installation into .env. In a real deployment these come
      # from a secret manager; they are the difference between a
      # tamper-evident chain and a decorative one.
      REMORA_PDP_SIGNING_KEY: ${REMORA_PDP_SIGNING_KEY:?run "python run.py up" first}
      REMORA_LEASE_SIGNING_KEY: ${REMORA_LEASE_SIGNING_KEY}
      REMORA_AUDIT_SIGNING_KEY: ${REMORA_AUDIT_SIGNING_KEY}
      REMORA_ENVELOPE_SIGNING_KEY: ${REMORA_ENVELOPE_SIGNING_KEY}

      # --- Deployment-owned semantics ------------------------------------
      # The three things this product declares about itself: which callables
      # exist, what they mean, and how risky they are.
      REMORA_TOOL_REGISTRY_MODULE: toolpacks.work_order.registry
      REMORA_SEMANTIC_BUNDLE_MODULE: toolpacks.work_order.bundle
      REMORA_TOOL_METADATA_FILE: /app/toolpacks/work_order/tool_metadata.json
      AAE_WORK_ORDER_AUTHORITY_FILE: /app/toolpacks/work_order/work_orders.json

      # The deterministic ACCEPT. Opt-in in the core because it is meaningless
      # without declared contracts, a state index and an intent source — this
      # deployment has all three, which is what makes turning it on defensible
      # here and not by default there.
      REMORA_GROUNDED_READ_ACCEPT: "1"

      # --- Signed ToolSpec bundle ----------------------------------------
      # The authority to call each tool. Signed by the deployment, never by
      # the agent. The PINNED DIGEST is the part people skip: a signature
      # proves a bundle is authentic, never that it is current.
      REMORA_TOOLSPEC_BUNDLE: /app/toolpacks/work_order/tool_specs.signed.json
      REMORA_TOOLSPEC_SIGNING_KEY: ${REMORA_TOOLSPEC_SIGNING_KEY:?run "python run.py up" first}
      REMORA_TOOLSPEC_TRUSTED_IDENTITIES: aae.work_order_signer/v1
      REMORA_TOOLSPEC_PINNED_DIGEST: ${REMORA_TOOLSPEC_PINNED_DIGEST:-}

      # --- The system of record ------------------------------------------
      # The control plane's tool callables get the WRITER credential and
      # nothing else. The reader DSN is deliberately absent from this
      # container: the postcondition reader runs in the CLI, outside the
      # process that performs the actions it verifies.
      AAE_WORKORDER_DSN: postgresql://aae_worker:${AAE_WORKER_PASSWORD}@workorder-db:5432/workorders

      REMORA_EXECUTION_ARTIFACT_DIR: /var/lib/aae/artifacts
      # /metrics stays behind a bearer token. Inherited as "1" from the
      # upstream pilot, where the comment said "local pilot only" — it
      # discloses decision volumes and auth-failure counts to anyone who
      # can reach the port. /v1/metrics is the authenticated view.
      REMORA_PROMETHEUS_PUBLIC: "${AAE_PUBLIC_METRICS:-0}"
    volumes:
      - aae-artifacts:/var/lib/aae/artifacts
    # Least privilege. Every one of these was absent until a survey of the
    # running containers found writable root filesystems, full default
    # capabilities and no resource ceiling — the state a security review
    # flags before it reads any application code.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    pids_limit: 256

  # ── Demonstration dashboard ─────────────────────────────────────────
  # Read-only. Imports no REMORA module, holds no policy, and exposes no
  # endpoint that writes. Not an operator console: no login, no CSRF
  # protection, no per-user audit trail. Bound to loopback.
  console:
    build:
      context: .
      dockerfile: docker/console.Dockerfile
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [data, edge]
    ports:
      - "127.0.0.1:${AAE_CONSOLE_PORT:-8089}:8090"
    environment:
      AAE_API_URL: http://control-plane:8000
      # ONE credential, read-only. The console held all five — including
      # domain_expert and senior_authority — to run the scenarios. A
      # presentation surface with an approver credential is a high-value
      # target wearing a low-value label. Running the scenarios is a CLI
      # action now.
      AAE_TOKEN_VIEWER: ${AAE_TOKEN_VIEWER}
      # Same read-only credential the postcondition reader holds.
      AAE_WORKORDER_READER_DSN: postgresql://aae_reader:${AAE_READER_PASSWORD}@workorder-db:5432/workorders
      # SELECT-only on the governance database, so the ledger shows the real
      # audit chain rather than a reconstruction. Cannot write it.
      AAE_CHAIN_READER_DSN: postgresql://aae_chain_reader:${AAE_CHAIN_READER_PASSWORD}@control-plane-db:5432/remora
      AAE_CHAIN_TENANT: aae-work-orders
      # Posture panel reports booleans, never the signing key itself.
      AAE_TOOLSPEC_CONFIGURED: "1"
      AAE_TOOLSPEC_PINNED: ${REMORA_TOOLSPEC_PINNED_DIGEST:+1}
    # Least privilege. Every one of these was absent until a survey of the
    # running containers found writable root filesystems, full default
    # capabilities and no resource ceiling — the state a security review
    # flags before it reads any application code.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 256

  # ── The lab ─────────────────────────────────────────────────────────
  # A DEMONSTRATION AND TEST SURFACE, and the only container here that can
  # act. It holds every role token, has no login, and lets a caller choose the
  # role it acts as — which is exactly what a real deployment must never
  # permit, and why this is a separate service rather than a tab in the
  # console. See docker/lab.Dockerfile for the full reasoning.
  #
  # Everything it does is still governed: the control plane enforces role
  # separation against the lab exactly as against any other client, and every
  # call it makes lands in the audit chain. Choosing a role here selects which
  # credential is presented; it does not grant that credential's authority.
  #
  # Not part of a production profile. Remove this block and everything else
  # still runs.
  lab:
    build:
      context: .
      dockerfile: docker/lab.Dockerfile
    depends_on:
      control-plane: {condition: service_healthy}
    networks: [data, edge]
    ports:
      - "127.0.0.1:${AAE_LAB_PORT:-8090}:8090"
    environment:
      AAE_API_URL: http://control-plane:8000
      # Every role, on purpose. See the block comment above.
      AAE_TOKEN_AGENT: ${AAE_TOKEN_AGENT}
      AAE_TOKEN_REVIEWER: ${AAE_TOKEN_REVIEWER}
      AAE_TOKEN_EXPERT: ${AAE_TOKEN_EXPERT}
      AAE_TOKEN_SENIOR: ${AAE_TOKEN_SENIOR}
      AAE_TOKEN_VIEWER: ${AAE_TOKEN_VIEWER}
      # Read from the deployment's own declarations, so the composer offers the
      # tools the engine actually enforces rather than a copy that drifts.
      AAE_TOOLSPEC_FILE: /app/toolpacks/work_order/tool_specs.json
      AAE_WORK_ORDER_AUTHORITY_FILE: /app/toolpacks/work_order/work_orders.json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 256

networks:
  # No route off the host. This is the difference between a declaration and a
  # control — a container on `data` alone cannot reach out, whatever it wants.
  data:
    internal: true
  edge:

volumes:
  control-plane-data:
  workorder-data:
  aae-artifacts:
