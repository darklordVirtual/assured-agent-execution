name: PR — pinned core, contract, and the running vertical

# Two jobs, and the split is deliberate.
#
# The contract job needs no Docker and runs in seconds: it verifies the pin,
# checks the hand-written lock against the release-generated manifest, and
# proves the SDK surface this product depends on is really there. That is the
# fast gate, and it fails before anything is built.
#
# The vertical job brings the whole product up the way the README says to and
# runs the four decisions against it. Everything interesting this product got
# wrong was found by running it, not by unit testing it: an approver token
# that could also execute, a refusal that arrives as an outcome rather than an
# exception, a CRLF entrypoint, a hardcoded port, a runner module shadowing
# the package it was meant to run.
#
# It also scores the governance benchmark and checks the resulting report
# against the audit chain. Those two steps were absent for a day: every test
# here proves the product RUNS, and none of them proved it DECIDES correctly,
# so a policy regression would have shipped green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Pinned core artifacts and SDK contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the pinned core artifacts
        # Exit 1 = the artifacts are not what we pinned. Exit 2 = we could not
        # reach the release. Kept distinct so a network outage never reads as
        # a tampered artifact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_core_pin.py --out dist

      - name: Install the SDK from the pinned wheel
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]" "$(ls dist/remora-*.whl)[sdk]"
          pip install -e .

      - name: Contract, manifest agreement and import boundary
        run: python run.py check

  vertical:
    name: The product, running
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bring the whole product up
        # The same command the README gives a new developer. If this step
        # breaks, the install instructions are broken, which is the point of
        # running it here rather than a bespoke CI-only path.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run.py up

      - name: The four decisions
        run: python run.py scenarios

      - name: End-to-end, security and fault tests
        # AAE_REQUIRE_LIVE is set by run.py: a skipped suite fails here
        # rather than reporting green for tests that never ran.
        run: python run.py e2e

      - name: Score the decisions against the sealed answer key
        # The only gate that checks what the engine DECIDES rather than
        # whether the product runs. It scores every scenario blind — the run
        # opens no key — and fails on a regression, meaning a disagreement no
        # documented limitation accounts for. Known gaps stay green so the
        # gate does not become permanently red and therefore ignored.
        run: python run.py bench

      - name: The report matches the audit chain
        # A score is the harness's word for what it did until this passes. It
        # re-reads every chain position the run recorded and confirms the
        # hashes; a fabricated report produces a byte-identical file and fails
        # here.
        run: python run.py bench-verify

      - name: Publish the benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: benchmarks/report.json
          if-no-files-found: error

      - name: The signed ToolSpec bundle still verifies
        run: python run.py check-sign

      - name: Inventory what shipped
        run: python run.py sbom --out ./sbom

      - name: Publish the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 120 control-plane
          docker compose logs --tail 40 workorder-migrate

      - name: Tear down
        if: always()
        run: python run.py reset
